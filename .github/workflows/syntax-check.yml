name: Syntax Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          find . -type f -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
